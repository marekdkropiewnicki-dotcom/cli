name: Open feature/test PR

on:
  push:
    branches:
      - 'copilot/remove-firewall-component'

permissions:
  pull-requests: write
  contents: read

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create PR from feature/test to trunk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --repo marekdkropiewnicki-dotcom/cli \
            --title "Testowa zmiana README z iPhone" \
            --body $'Dodaje drugą testową linię w README z iPhone.\nBrak zmian w kodzie.' \
            --head feature/test \
            --base trunk \
            || echo "PR may already exist or creation failed"
