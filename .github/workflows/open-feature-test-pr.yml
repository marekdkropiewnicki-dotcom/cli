name: Open feature/test PR

on:
  push:
    branches:
      - 'trunk'
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create PR from feature/test to trunk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list \
            --repo marekdkropiewnicki-dotcom/cli \
            --head feature/test \
            --base trunk \
            --state open \
            --json number \
            --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #$existing already exists from feature/test to trunk."
          else
            gh pr create \
              --repo marekdkropiewnicki-dotcom/cli \
              --title "Testowa zmiana README z iPhone" \
              --body $'Dodaje drugą testową linię w README z iPhone.\nBrak zmian w kodzie.' \
              --head feature/test \
              --base trunk
          fi
